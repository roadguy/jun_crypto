services:
  - type: web
    name: crypto-direction-html
    runtime: python
    region: singapore
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: NUMEXPR_NUM_THREADS
        value: 1
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CRYPTO_XGB_DATA_ROOT
        value: ./data
